name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install optional deps
        run: pip install pyyaml
      - name: Run unit tests
        run: python -m unittest discover tests -v
      - name: Validate data files
        run: |
          python -c "import json; json.load(open('ontology.json'))"
          python -c "import yaml; yaml.safe_load(open('ai_slop_ontology.yaml'))"
