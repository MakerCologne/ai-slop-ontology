name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install optional deps
        run: pip install pyyaml hatchling
      - name: Run unit tests
        run: python -m unittest discover tests -v
      - name: Validate data files
        run: |
          python -c "import json; json.load(open('ontology.json'))"
          python -c "import yaml; yaml.safe_load(open('ai_slop_ontology.yaml'))"
      - name: Check JSON/YAML/TTL consistency
        run: python scripts/check_consistency.py
      - name: Smoke-test the slop CLI
        run: |
          python -m slopkit info
          python -m slopkit selfcheck
          echo "It's not a tool. It's a movement." | python -m slopkit rhetoric -
      - name: Smoke-test the installed wheel outside the checkout (#82)
        run: |
          python -m venv /tmp/slopkit-venv
          /tmp/slopkit-venv/bin/pip install .
          cd /tmp
          printf '%s\n' "In today's rapidly evolving digital landscape, leveraging synergies is not just a strategy, it's a necessity. This rich tapestry of innovation underscores a profound transformation. Let's delve into the multifaceted realm of seamless integration." > sample.txt
          /tmp/slopkit-venv/bin/slop info
          /tmp/slopkit-venv/bin/slop score sample.txt
          /tmp/slopkit-venv/bin/slop classify sample.txt

      - name: Run benchmark (informational)
        run: python eval/run_benchmark.py
