name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install optional deps
        run: pip install pyyaml
      - name: Run unit tests
        run: python -m unittest discover tests -v
      - name: Validate data files
        run: |
          python -c "import json; json.load(open('ontology.json'))"
          python -c "import yaml; yaml.safe_load(open('ai_slop_ontology.yaml'))"
      - name: Check JSON/YAML/TTL consistency
        run: python scripts/check_consistency.py
      - name: Smoke-test the slop CLI
        run: |
          python -m slopkit info
          python -m slopkit selfcheck
          echo "It's not a tool. It's a movement." | python -m slopkit rhetoric -
      - name: Verify extension citation sources (offline)
        run: python extensions/human-work-seo-slop/verify_sources.py
      - name: Install from wheel and run outside the checkout
        run: |
          python -m venv /tmp/wheeltest
          /tmp/wheeltest/bin/pip install --quiet .
          cd /tmp
          /tmp/wheeltest/bin/slop info
          /tmp/wheeltest/bin/slop score "delve into the rich tapestry of synergy"
      - name: Run benchmark (informational)
        run: python eval/run_benchmark.py
