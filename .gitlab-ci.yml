# GitLab CI für ai-slop-ontology (#100).
# Shell-Runner (kein Docker): python3 + venv statt python:3.12-slim Image.
# Führt scripts/verify.sh aus — 8 Gates + Benchmark-Untergrenzen.

stages:
  - verify

workflow:
  rules:
    - when: always

verify-gates:
  stage: verify
  before_script:
    - python3 --version
    - python3 -m venv .ci-venv
    - ./.ci-venv/bin/pip install --quiet --upgrade pip
    - ./.ci-venv/bin/pip install --quiet pytest pyyaml hatchling
    - export PATH="$CI_PROJECT_DIR/.ci-venv/bin:$PATH"
  script:
    - bash scripts/verify.sh
