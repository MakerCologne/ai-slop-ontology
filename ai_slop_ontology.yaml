ontology:
  name: ai_slop_ontology
  version: "0.1"
  purpose: >
    Classify, score, filter, cite, and mitigate low-quality synthetic or
    AI-assisted content in agentic search, RAG, memory, publishing,
    moderation, and research workflows.

  classes:
    ContentItem:
      description: Any discrete unit of digital content.
      properties:
        - content_id
        - medium
        - source_url
        - creator
        - platform
        - published_at
        - language
        - topic
        - claims
        - citations
        - provenance

    SyntheticContent:
      is_a: ContentItem
      description: Content fully or substantially generated by AI.

    AIAssistedContent:
      is_a: ContentItem
      description: Human-directed content where AI contributed to drafting, editing, media generation, or transformation.

    AISlopCandidate:
      is_a: ContentItem
      description: Content with enough signals to require slop scoring.

    ConfirmedAISlop:
      is_a: AISlopCandidate
      rule: >
        slop_score >= 0.70 AND evidence_confidence >= 0.65

    NonSlopAIContent:
      is_a: AIAssistedContent
      description: AI-assisted or AI-generated content with clear utility, disclosure, validation, and sufficient quality.

    LowQualityHumanContent:
      is_a: ContentItem
      description: Low-quality content without sufficient evidence of AI generation.

    SpamContent:
      is_a: ContentItem
      description: Content primarily distributed abusively or manipulatively, regardless of generation method.

    SlopProducer:
      description: Account, channel, domain, content farm, bot, or organization producing slop-like content at scale.

    DistributionChannel:
      description: Feed, search index, recommendation system, marketplace, social platform, RAG corpus, or knowledge base.

    DetectionEvidence:
      description: Observed signal supporting classification.

    MitigationAction:
      description: Action taken by an agent or platform.

  properties:
    has_generation_mode:
      range:
        - human_authored
        - ai_assisted
        - fully_synthetic
        - templated_automation
        - scraped_remixed
        - unknown

    has_medium:
      range:
        - text
        - image
        - video
        - audio
        - music
        - code
        - academic_paper
        - legal_document
        - product_listing
        - social_post
        - search_result
        - multimodal

    has_intent:
      range:
        - attention_farming
        - ad_revenue
        - search_manipulation
        - recommendation_poisoning
        - affiliate_funnel
        - credential_inflation
        - disinformation
        - careless_speech
        - impersonation
        - entertainment
        - productivity
        - unknown

    has_quality_failure:
      range:
        - factual_error
        - hallucinated_citation
        - incoherence
        - irrelevance
        - redundancy
        - genericity
        - missing_context
        - aesthetic_artifact
        - unsafe_instruction
        - misleading_functionality
        - unverifiable_claim
        - lack_of_originality

    has_distribution_pattern:
      range:
        - isolated
        - mass_upload
        - templated_series
        - bot_network
        - content_farm
        - expired_domain_abuse
        - platform_recommendation_boost
        - cross_platform_repost
        - search_result_saturation

    has_provenance_status:
      range:
        - disclosed_ai
        - platform_labeled_ai
        - c2pa_present
        - watermark_detected
        - self_claimed_human
        - provenance_missing
        - provenance_conflicting
        - provenance_falsified

    has_harm_type:
      range:
        - misinformation
        - trust_erosion
        - creator_displacement
        - royalty_dilution
        - review_burden
        - legal_risk
        - academic_integrity_risk
        - child_safety_risk
        - retrieval_contamination
        - model_collapse_risk
        - brand_damage
        - user_time_waste

  scores:
    slop_score:
      type: float
      min: 0
      max: 1
      formula_hint: >
        weighted_sum(
          syntheticity, quality_deficit, substance_deficit,
          verification_deficit, effort_asymmetry, mass_production,
          deceptiveness, distribution_manipulation, harm_potential,
          retrieval_risk
        )

    evidence_confidence:
      type: float
      min: 0
      max: 1

    retrieval_trust_score:
      type: float
      min: 0
      max: 1
      description: Agent-specific score for whether the item should be used as evidence.

  slopness_dimensions:
    syntheticity:
      question: How strongly is the content AI-generated?
      signals: C2PA, watermarks, style, detector, self-label
    quality_deficit:
      question: How poor is the content relative to its purpose?
      signals: errors, redundancy, superficiality
    substance_deficit:
      question: Is there real information, experience, primary data?
      signals: no sources, no examples, no originality
    verification_deficit:
      question: Has it been verified?
      signals: fake citations, no evidence, hallucinations
    effort_asymmetry:
      question: Was generation extremely cheap relative to consumption/review cost?
      signals: workslop, PR-slop, review burden
    mass_production:
      question: Are there scaling patterns?
      signals: many similar pages, upload spikes
    deceptiveness:
      question: Is AI use obscured or identity impersonated?
      signals: missing label, fake author, voice clone
    distribution_manipulation:
      question: Is an algorithm being exploited?
      signals: SEO/GEO, hashtag spam, ranking clusters
    harm_potential:
      question: What can go wrong?
      signals: disinformation, fraud, children content, legal, medical
    retrieval_risk:
      question: Can the content contaminate RAG/search/agents?
      signals: high ranking status, many copies, synthetic source

  relations:
    generated_by:
      domain: ContentItem
      range: CreatorOrModel
    distributed_via:
      domain: ContentItem
      range: DistributionChannel
    produced_by:
      domain: ContentItem
      range: SlopProducer
    cites:
      domain: ContentItem
      range: Source
    duplicates_or_paraphrases:
      domain: ContentItem
      range: ContentItem
    contaminates:
      domain: ContentItem
      range:
        - SearchIndex
        - RAGCorpus
        - TrainingDataset
        - AgentMemory
    mitigated_by:
      domain: ContentItem
      range: MitigationAction

  mitigation_actions:
    - label_as_ai_generated
    - label_as_low_confidence
    - exclude_from_rag
    - require_human_review
    - demote_in_ranking
    - demonetize
    - block_source
    - verify_citations
    - quarantine_for_dataset
    - preserve_but_do_not_cite

  agent_rules:
    retrieval_rule:
      description: Tiered handling of slop candidates
      thresholds:
        high_risk:
          condition: slop_score >= 0.70
          actions:
            - do_not_use_as_primary_source
            - require_independent_verification
            - do_not_store_in_long_term_memory_as_fact
        medium_risk:
          condition: 0.40 <= slop_score < 0.70
          actions:
            - use_only_as_weak_signal
            - cross_check_with_primary_sources
            - mark_as_low_confidence
        low_risk:
          condition: slop_score < 0.40
          actions:
            - allow_with_normal_source_quality_checks

    source_rule:
      description: >
        A source is not trustworthy because it is highly ranked.
        A source is trustworthy when provenance, expertise, originality,
        citation integrity, and external corroboration are strong.
      warning: >
        Retrieval Collapse arises when agents confuse search rankings
        or frequently replicated synthetic content with evidence.

    memory_rule:
      description: Never write suspected AI slop into durable memory as factual knowledge.
      allowed_storage_as:
        - observed_claim
        - unverified_claim
        - slop_candidate
        - distribution_pattern
        - source_risk_signal

    citation_rule:
      description: Do not cite the following
      do_not_cite:
        - AI-generated summaries without primary source
        - SEO listicles with no original reporting
        - articles with hallucinated or unverifiable references
        - synthetic social posts as factual evidence
        - copied content farms as independent corroboration

    critical_review_rule:
      description: ALWAYS escalate for legal, medical, political, financial, child safety, or identity impersonation domains — regardless of slop score.
      always_escalate_domains:
        - legal
        - medical
        - political
        - financial
        - child_safety
        - identity_impersonation

  classification_thresholds:
    low_slop_risk:
      range: "0.00–0.24"
      agent_behavior: normal use; source checks still required
    moderate_slop_risk:
      range: "0.25–0.49"
      agent_behavior: use only with cross-checking
    high_slop_risk:
      range: "0.50–0.69"
      agent_behavior: not as primary source; human review
    ai_slop_candidate:
      range: "0.70–1.00"
      agent_behavior: do not cite; do not store in memory as fact
    critical_review_required:
      range: any + high harm
      agent_behavior: always escalate for legal/medical/political/financial/children/identity domains

  detection_signals:
    content_based:
      - signal: generic language
        relevance: often text slop
      - signal: missing primary sources
        relevance: high RAG risk
      - signal: hallucinated citations
        relevance: academic / legal high-risk case
      - signal: contradictory details
        relevance: weak validation
      - signal: over-polished banality
        relevance: "superficial competence"
      - signal: little concrete experience
        relevance: no real authorship
      - signal: repeated structure
        relevance: templated or serial production
    behavioral:
      - signal: very high upload frequency
        relevance: mass production
      - signal: many similar titles/thumbnails
        relevance: content farm
      - signal: cross-posting on many domains
        relevance: reach or SEO play
      - signal: sudden topic changes
        relevance: opportunism
      - signal: new accounts with high output rate
        relevance: slop producer
      - signal: clusters with mutual citations
        relevance: citation inflation
    provenance:
      - signal: C2PA present
        relevance: useful but not sufficient
      - signal: watermark / SynthID
        relevance: useful but not complete
      - signal: platform label
        relevance: helpful but inconsistent
      - signal: missing authorship
        relevance: suspicious
      - signal: false authorship
        relevance: strongly suspicious
      - signal: disclosed AI use + human review
        relevance: rather exonerating

  reference_architecture:
    stages:
      - name: Source Intake
      - name: Provenance Extractor
        checks:
          - C2PA / metadata
          - platform label
          - author/account history
          - publication pattern
      - name: Content Quality Analyzer
        checks:
          - factuality
          - citation validity
          - specificity
          - originality
          - coherence
          - task usefulness
      - name: Distribution Analyzer
        checks:
          - mass production
          - duplication
          - SEO/GEO signals
          - network clusters
      - name: Slop Scorer
        outputs:
          - slop_score
          - evidence_confidence
          - retrieval_trust_score
      - name: Policy Layer
        decisions:
          - cite / do not cite
          - retrieve / quarantine
          - store / do not store
          - ask human / auto proceed
      - name: Agent Memory
        rules:
          - facts only from trusted sources
          - claims stored with confidence
          - slop patterns stored as risk signals
