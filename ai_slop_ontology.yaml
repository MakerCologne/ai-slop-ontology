ontology:
  name: ai_slop_ontology
  version: "1.7.0"
  updated: "2026-08-25"
  purpose: >
    Classify, score, filter, cite, and mitigate low-quality synthetic or
    AI-assisted content in agentic search, RAG, memory, publishing,
    moderation, and research workflows.

  classes:
    ContentItem:
      description: Any discrete unit of digital content.
      properties:
        - content_id
        - medium
        - source_url
        - creator
        - platform
        - published_at
        - language
        - topic
        - claims
        - citations
        - provenance

    SyntheticContent:
      is_a: ContentItem
      description: Content fully or substantially generated by AI.

    AIAssistedContent:
      is_a: ContentItem
      description: Human-directed content where AI contributed to drafting, editing, media generation, or transformation.

    AISlopCandidate:
      is_a: ContentItem
      description: Content with enough signals to require slop scoring.

    ConfirmedAISlop:
      is_a: AISlopCandidate
      rule: >
        slop_score >= 0.70 AND evidence_confidence >= 0.65

    NonSlopAIContent:
      is_a: AIAssistedContent
      description: AI-assisted or AI-generated content with clear utility, disclosure, validation, and sufficient quality.

    LowQualityHumanContent:
      is_a: ContentItem
      description: Low-quality content without sufficient evidence of AI generation.

    SpamContent:
      is_a: ContentItem
      description: Content primarily distributed abusively or manipulatively, regardless of generation method.

    SlopProducer:
      description: Account, channel, domain, content farm, bot, or organization producing slop-like content at scale.

    DistributionChannel:
      description: Feed, search index, recommendation system, marketplace, social platform, RAG corpus, or knowledge base.

    DetectionEvidence:
      description: Observed signal supporting classification.

    MitigationAction:
      description: Action taken by an agent or platform.

  properties:
    has_generation_mode:
      range:
        - human_authored
        - ai_assisted
        - fully_synthetic
        - templated_automation
        - scraped_remixed
        - unknown

    has_medium:
      range:
        - text
        - image
        - video
        - audio
        - music
        - code
        - academic_paper
        - legal_document
        - product_listing
        - social_post
        - search_result
        - multimodal

    has_intent:
      range:
        - attention_farming
        - ad_revenue
        - search_manipulation
        - recommendation_poisoning
        - affiliate_funnel
        - credential_inflation
        - disinformation
        - careless_speech
        - impersonation
        - entertainment
        - productivity
        - unknown

    has_quality_failure:
      range:
        - factual_error
        - hallucinated_citation
        - incoherence
        - irrelevance
        - redundancy
        - genericity
        - missing_context
        - aesthetic_artifact
        - unsafe_instruction
        - misleading_functionality
        - unverifiable_claim
        - lack_of_originality

    has_distribution_pattern:
      range:
        - isolated
        - mass_upload
        - templated_series
        - bot_network
        - content_farm
        - expired_domain_abuse
        - platform_recommendation_boost
        - cross_platform_repost
        - search_result_saturation

    has_provenance_status:
      range:
        - disclosed_ai
        - platform_labeled_ai
        - c2pa_present
        - watermark_detected
        - self_claimed_human
        - provenance_missing
        - provenance_conflicting
        - provenance_falsified

    has_harm_type:
      range:
        - misinformation
        - trust_erosion
        - creator_displacement
        - royalty_dilution
        - review_burden
        - legal_risk
        - academic_integrity_risk
        - child_safety_risk
        - retrieval_contamination
        - model_collapse_risk
        - brand_damage
        - user_time_waste

  scores:
    slop_score:
      type: float
      min: 0
      max: 1
      formula_hint: >
        weighted_sum(
          syntheticity, quality_deficit, substance_deficit,
          verification_deficit, effort_asymmetry, mass_production,
          deceptiveness, distribution_manipulation, harm_potential,
          retrieval_risk
        )

    evidence_confidence:
      type: float
      min: 0
      max: 1

    retrieval_trust_score:
      type: float
      min: 0
      max: 1
      description: Agent-specific score for whether the item should be used as evidence.

  slopness_dimensions:
    syntheticity:
      question: Wie stark ist der Inhalt KI-generiert?
      signals: C2PA, Wasserzeichen, Stil, Detector, Selbstlabel
    quality_deficit:
      question: Wie schlecht ist der Inhalt relativ zum Zweck?
      signals: Fehler, Redundanz, Oberflächlichkeit
    substance_deficit:
      question: Gibt es echte Information, Erfahrung, Primärdaten?
      signals: keine Quellen, keine Beispiele, keine Originalität
    verification_deficit:
      question: Wurde geprüft?
      signals: fake citations, keine Belege, Halluzinationen
    effort_asymmetry:
      question: War die Erzeugung extrem billig gegenüber Konsum-/Reviewkosten?
      signals: Workslop, PR-Slop, Review-Burden
    mass_production:
      question: Gibt es Skalierungsmuster?
      signals: viele ähnliche Seiten, Upload-Spikes
    deceptiveness:
      question: Wird KI-Nutzung verschleiert oder Identität imitiert?
      signals: fehlendes Label, Fake-Autor, Voice Clone
    distribution_manipulation:
      question: Wird ein Algorithmus ausgenutzt?
      signals: SEO/GEO, Hashtag-Spam, Ranking-Cluster
    harm_potential:
      question: Was kann schiefgehen?
      signals: Desinformation, Betrug, Kindercontent, Recht, Medizin
    retrieval_risk:
      question: Kann der Inhalt RAG/Search/Agenten kontaminieren?
      signals: hoher Ranking-Status, viele Kopien, synthetische Quelle

  relations:
    generated_by:
      domain: ContentItem
      range: CreatorOrModel
    distributed_via:
      domain: ContentItem
      range: DistributionChannel
    produced_by:
      domain: ContentItem
      range: SlopProducer
    cites:
      domain: ContentItem
      range: Source
    duplicates_or_paraphrases:
      domain: ContentItem
      range: ContentItem
    contaminates:
      domain: ContentItem
      range:
        - SearchIndex
        - RAGCorpus
        - TrainingDataset
        - AgentMemory
    mitigated_by:
      domain: ContentItem
      range: MitigationAction

  mitigation_actions:
    - label_as_ai_generated
    - label_as_low_confidence
    - exclude_from_rag
    - require_human_review
    - demote_in_ranking
    - demonetize
    - block_source
    - verify_citations
    - quarantine_for_dataset
    - preserve_but_do_not_cite

  agent_rules:
    retrieval_rule:
      description: Abgestufte Behandlung von Slop-Kandidaten
      thresholds:
        high_risk:
          condition: slop_score >= 0.70
          actions:
            - do_not_use_as_primary_source
            - require_independent_verification
            - do_not_store_in_long_term_memory_as_fact
        medium_risk:
          condition: 0.40 <= slop_score < 0.70
          actions:
            - use_only_as_weak_signal
            - cross_check_with_primary_sources
            - mark_as_low_confidence
        low_risk:
          condition: slop_score < 0.40
          actions:
            - allow_with_normal_source_quality_checks

    source_rule:
      description: >
        A source is not trustworthy because it is highly ranked.
        A source is trustworthy when provenance, expertise, originality,
        citation integrity, and external corroboration are strong.
      warning: >
        Retrieval Collapse arises when agents confuse search rankings
        or frequently replicated synthetic content with evidence.

    memory_rule:
      description: Never write suspected AI slop into durable memory as factual knowledge.
      allowed_storage_as:
        - observed_claim
        - unverified_claim
        - slop_candidate
        - distribution_pattern
        - source_risk_signal

    citation_rule:
      description: Do not cite the following
      do_not_cite:
        - AI-generated summaries without primary source
        - SEO listicles with no original reporting
        - articles with hallucinated or unverifiable references
        - synthetic social posts as factual evidence
        - copied content farms as independent corroboration

    critical_review_rule:
      description: Bei Recht, Medizin, Politik, Finanzen, Kindern, Identitätsmissbrauch IMMER eskalieren — unabhängig vom Slop-Score.
      always_escalate_domains:
        - legal
        - medical
        - political
        - financial
        - child_safety
        - identity_impersonation

  classification_thresholds:
    low_slop_risk:
      range: "0.00–0.24"
      agent_behavior: normal nutzbar, Quellenprüfung bleibt nötig
    moderate_slop_risk:
      range: "0.25–0.49"
      agent_behavior: nur mit Gegenprüfung verwenden
    high_slop_risk:
      range: "0.50–0.69"
      agent_behavior: nicht als Hauptquelle, Human Review
    ai_slop_candidate:
      range: "0.70–1.00"
      agent_behavior: nicht zitieren, nicht in Memory als Fakt speichern
    critical_review_required:
      range: any + high harm
      agent_behavior: bei Recht/Medizin/Politik/Finanzen/Kindern/Identität immer eskalieren

  detection_signals:
    content_based:
      - signal: generische Sprache
        relevance: oft Text-Slop
      - signal: fehlende Primärquellen
        relevance: hohes RAG-Risiko
      - signal: halluzinierte Zitate
        relevance: akademischer / rechtlicher Hochrisikofall
      - signal: widersprüchliche Details
        relevance: schwache Validierung
      - signal: überperfekte Banalität
        relevance: "superficial competence"
      - signal: wenig konkrete Erfahrung
        relevance: keine echte Autorschaft
      - signal: wiederholte Struktur
        relevance: Template- oder Serienproduktion
    behavioral:
      - signal: sehr hohe Upload-Frequenz
        relevance: Massenerzeugung
      - signal: viele ähnliche Titel/Thumbnails
        relevance: Content-Farm
      - signal: Crossposting auf vielen Domains
        relevance: Reichweiten- oder SEO-Spiel
      - signal: plötzliche Themenwechsel
        relevance: Opportunismus
      - signal: neue Accounts mit hoher Outputrate
        relevance: Slop Producer
      - signal: Cluster mit gegenseitigen Zitaten
        relevance: Citation Inflation
    provenance:
      - signal: C2PA vorhanden
        relevance: nützlich, aber nicht ausreichend
      - signal: Wasserzeichen / SynthID
        relevance: nützlich, aber nicht vollständig
      - signal: Plattformlabel
        relevance: hilfreich, aber inkonsistent
      - signal: fehlende Autorschaft
        relevance: Verdacht
      - signal: falsche Autorschaft
        relevance: starker Verdacht
      - signal: offengelegter KI-Einsatz + Human Review
        relevance: eher entlastend

  reference_architecture:
    stages:
      - name: Source Intake
      - name: Provenance Extractor
        checks:
          - C2PA / metadata
          - platform label
          - author/account history
          - publication pattern
      - name: Content Quality Analyzer
        checks:
          - factuality
          - citation validity
          - specificity
          - originality
          - coherence
          - task usefulness
      - name: Distribution Analyzer
        checks:
          - mass production
          - duplication
          - SEO/GEO signals
          - network clusters
      - name: Slop Scorer
        outputs:
          - slop_score
          - evidence_confidence
          - retrieval_trust_score
      - name: Policy Layer
        decisions:
          - cite / do not cite
          - retrieve / quarantine
          - store / do not store
          - ask human / auto proceed
      - name: Agent Memory
        rules:
          - facts only from trusted sources
          - claims stored with confidence
          - slop patterns stored as risk signals

  # Empirical updates 2026-07 (see REFERENCES.md #31-38)
  empirical_updates_2026_07:
    newsguard_content_farms:
      count: 3749
      date: "2026-06-23"
      languages: 16
    deezer_ai_music:
      share_of_uploads: "44%"
      tracks_per_day: 75000
      share_of_streams: "1-3%"
      fraudulent_streams: "~85% flagged & demonetized"
    academic_publishing:
      journal: Organization Science
      submissions_increase: "+42% since ChatGPT"
      ai_in_peer_reviews: ">30%"
      readability_drop_sd: 1.28
    security_reports:
      project: curl
      slop_share_mid_2025: "~20%"
      outcome: "bug bounty closed 2026-02-01"
    new_slop_types:
      - SecurityReportSlop
      - PeerReviewSlop
